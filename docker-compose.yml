version: '3.8'

services:
  tiny-requestbin:
    image: knktc/tiny-requestbin:latest
    ports:
      - "8282:8282"  # Request capture
      - "8283:8283"  # Web panel
    
    # Custom startup arguments
    command: ["-port", "8282", "-panel-port", "8283", "-listen", "0.0.0.0", "-max", "100"]

    restart: unless-stopped
