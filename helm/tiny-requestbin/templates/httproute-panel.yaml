{{- if .Values.panelHttpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "tiny-requestbin.fullname" . }}-panel
  labels:
    {{- include "tiny-requestbin.labels" . | nindent 4 }}
  {{- with .Values.panelHttpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.panelHttpRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.panelHttpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "tiny-requestbin.fullname" . }}
          port: {{ .Values.service.panelPort }}
{{- end }}
