# Default values for tiny-requestbin
replicaCount: 1

image:
  repository: knktc/tiny-requestbin
  tag: "latest"
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Application configuration (passed as CLI flags)
config:
  # Port for capturing requests
  port: 8282
  # Port for the web panel
  panelPort: 8283
  # Address to listen on (must be 0.0.0.0 in Kubernetes)
  listen: "0.0.0.0"
  # Maximum number of requests to store in memory
  max: 1000
  # Print requests to stdout
  cli: false
  # Public base URL for capturing requests, shown in the web panel.
  # Set this when requests reach the app through a gateway or proxy,
  # e.g. "https://requestbin.example.com". Empty = derive from the panel's host.
  publicCaptureUrl: ""

service:
  type: ClusterIP
  # Service port for capturing requests
  port: 8282
  # Service port for the web panel
  panelPort: 8283

# HTTPRoute (Gateway API) configuration
httpRoute:
  enabled: false
  # Parent gateway references
  # parentRefs:
  #   - name: my-gateway
  #     namespace: default
  parentRefs: []
  # Hostnames for the HTTPRoute
  # hostnames:
  #   - requestbin.example.com
  hostnames: []
  # Additional annotations
  annotations: {}

# HTTPRoute (Gateway API) configuration for the web panel.
# Uses a separate hostname from the capture route.
panelHttpRoute:
  enabled: false
  parentRefs: []
  # hostnames:
  #   - requestbin-panel.example.com
  hostnames: []
  annotations: {}

resources:
  limits:
    cpu: 500m
    memory: 128Mi

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  readOnlyRootFilesystem: true

nodeSelector: {}
tolerations: []
affinity: {}
